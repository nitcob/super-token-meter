name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash          # consistent across Linux/macOS/Windows (Git Bash)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"    # also test the minimum supported Python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile (no syntax errors)
        run: python -m compileall -q super_token_meter scripts tests
      - name: Tests (stdlib only, no deps)
        run: |
          for f in tests/test_*.py; do echo "== $f =="; python "$f"; done
      - name: JSON sanity (pricing + example data valid)
        run: |
          python -c "import json; json.load(open('super_token_meter/pricing.json')); print('pricing ok')"
          python -c "import json; json.load(open('examples/claude_usage.json')); json.load(open('examples/local_usage.json')); print('examples ok')"
      - name: Windows installer parses (PowerShell syntax)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.PSParser]::Tokenize((Get-Content scripts/install.ps1 -Raw), [ref]$errs) | Out-Null
          if ($errs -and $errs.Count -gt 0) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "scripts/install.ps1 parses OK"

  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools (runtime stays zero-dep; these are dev-only)
        run: pip install -e ".[dev]"
      - name: ruff (lint — real bugs + import order)
        run: ruff check super_token_meter tests scripts
      - name: mypy (type-check — lenient)
        run: mypy

  coverage:
    name: coverage (fail-under gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools (coverage is dev-only; runtime stays zero-dep)
        run: pip install -e ".[dev]"
      - name: Run the suite under coverage and enforce the gate
        run: |
          for f in tests/test_*.py; do coverage run -p "$f"; done
          coverage combine
          coverage report   # fail_under is set in pyproject.toml

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t stm:ci .
      - name: Smoke test (serve demo data in-container, curl from host)
        run: |
          docker run -d --name stm -p 127.0.0.1:8722:8722 -v "$PWD/examples:/seed:ro" stm:ci \
            sh -c "mkdir -p /data && cp /seed/*.json /data/ && python -m super_token_meter serve --no-collect --host 0.0.0.0 --port 8722 --no-browser"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8722/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8722/ | grep -q "Super Token Meter"
          curl -sf http://127.0.0.1:8722/data/claude_usage.json >/dev/null
          echo "docker smoke OK"
          docker rm -f stm

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
